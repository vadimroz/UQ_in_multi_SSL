dataset:
  dataset: SYNTHETIC
  localization_method: SRP_DNN
  localization_dir: srp_dnn
  kmax: 3
  snr_db: 15
  reverb_ms: 700

paths:
  loss_parquet: data/srp_dnn/Synthetic/Reverb_700_ms_SNR_15_dB/loss.parquet
  speakers_glob: data/srp_dnn/Synthetic/Reverb_700_ms_SNR_15_dB/speakers_*.npz
  speaker_1_npz: data/srp_dnn/Synthetic/Reverb_700_ms_SNR_15_dB/speakers_1.npz
  speaker_2_npz: data/srp_dnn/Synthetic/Reverb_700_ms_SNR_15_dB/speakers_2.npz
  speaker_3_npz: data/srp_dnn/Synthetic/Reverb_700_ms_SNR_15_dB/speakers_3.npz

simulation:
  # Number of times to repeat the complete split, selection, and evaluation procedure.
  num_iterations: 100
  # Held-out sample indices per speaker count in each iteration.
  test_sets: 50
  calibration_split_policy: explicit
  # calibration_total must equal calib_opt + calib_test.
  calibration_total: 450
  # Samples per speaker count used to build and order the candidate configurations.
  calib_opt: 225
  # Independent samples per speaker count used by fixed-sequence testing (FST).
  calib_test: 225
  # total_samples must equal calibration_total + test_sets.
  total_samples: 500

calibration:
  delta: 0.1
  alpha_MC: 0.1
  alpha_MD: 0.1
  free_risks:
    - Risk_Area
    - Risk_FA

evaluation:
  normalize_loss_area_by_estimated_speakers: true
  include_angular_errors: true
